image: node:20

stages:
  - build
  - deploy

# Stage 1: Build the Vue application using Bun
build_game:
  stage: build
  only:
    - master
  before_script:
    # download zig
    - apt-get update && apt-get install -y wget xz-utils
    - wget https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
    - tar -xf zig-linux-x86_64-0.16.0.tar.xz
    - export PATH=$PATH:$(pwd)/zig-linux-x86_64-0.16.0
    - zig version
  script:
    - npm install -g bun
    - bun install
    - bun run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# Stage 2: Deploy the compiled files to Firebase
deploy_hosting:
  stage: deploy
  only:
    - master
  dependencies:
    - build_game
  script:
    - npm install -g firebase-tools
    - firebase deploy --non-interactive --only hosting --token $FIREBASE_TOKEN
